<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>晨光酒店 · 合成翻修 Demo</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #16294e, #11203c);
        color: #eaf0ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 520px;
        background: #1a2b4d;
        border: 1px solid #2a4170;
        border-radius: 16px;
        padding: 28px 32px;
        line-height: 1.7;
      }
      h1 { margin: 0 0 16px; font-size: 22px; color: #ffd36e; }
      p { margin: 0 0 12px; }
      code {
        background: #0f1c36;
        padding: 2px 6px;
        border-radius: 4px;
        color: #7ee0ff;
        word-break: break-all;
      }
      .btn {
        display: inline-block;
        margin-top: 16px;
        background: linear-gradient(180deg, #e8b44d, #c9963a);
        color: #0d1628;
        text-decoration: none;
        font-weight: 700;
        padding: 12px 24px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
      }
      .btn:hover { filter: brightness(1.08); }
      .muted { color: #8ca0c8; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="card" id="msg">
      <h1>打开方式不对</h1>
      <p>你当前打开的是<strong>源码入口</strong> <code>index.html</code>，它需要 Vite 开发服务器才能解析 TypeScript 和样式。</p>
      <p>请直接打开已打包好的单文件版本：</p>
      <p><code>deliverables/20260727_MergeHotel_Demo/dist-single/index.html</code></p>
      <a class="btn" id="openLink" href="./dist-single/index.html">打开可运行版本</a>
      <p class="muted">该版本 CSS + JS 全内联，可双击用浏览器直接打开，无需服务器。</p>
    </div>
    <script>
      if (location.protocol === 'file:') {
        // file:// 协议下直接跳转到单文件版本
        var target = location.href.replace(/index\.html$/, '') + 'dist-single/index.html';
        document.getElementById('openLink').href = target;
        // 给 1.5 秒阅读提示后再跳转
        setTimeout(function() {
          location.replace(target);
        }, 1500);
      }
    </script>
  </body>
</html>
